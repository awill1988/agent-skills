name: Collection Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'tools/**'
      - '.claude-plugin/**'
      - '.agents/**'
      - 'plugin.json'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Validate collection
        run: python tools/validate_collection.py
      - name: Test validation and creator
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Test lint and model-review reporting
        run: python -m unittest discover -s tools/skill_reviewer -p 'test_*.py'
      - name: Test comment scanner
        run: python -m unittest discover -s skills/code-documentation-simplification/scripts -p 'test_*.py'
